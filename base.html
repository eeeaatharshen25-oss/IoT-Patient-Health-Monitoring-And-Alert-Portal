<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CareMonitor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script defer src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('dashboard') }}">♥ CareMonitor <span>IoT Portal</span></a>
  <nav><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('patients') }}">Patients</a></nav>
</header>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>Educational prototype · Not for medical diagnosis or emergency monitoring</footer>
</body></html>
